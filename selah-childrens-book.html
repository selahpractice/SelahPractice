    height: 14px;
    border-radius: 50%;
    background: var(--amber);
    cursor: pointer;
    border: 2px solid var(--parchment);
    box-shadow: 0 0 0 1px var(--amber);
  }

  .slider-val {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--amber);
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }

  .slider-poles {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 3px;
  }

  /* CHECKBOX GRID */
  .check-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 4px;
  }

  .check-item {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  .check-item input[type=checkbox] {
    display: none;
  }

  .check-box {
    width: 14px;
    height: 14px;
    border: 1px solid var(--border);
    flex-shrink: 0;
    position: relative;
    transition: all 0.15s;
  }

  .check-item input:checked + .check-box {
    background: var(--amber);
    border-color: var(--amber);
  }

  .check-item input:checked + .check-box::after {
    content: '✓';
    position: absolute;
    top: -1px;
    left: 1px;
    font-size: 11px;
    color: white;
  }

  .check-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    color: var(--ink);
  }

  /* TEXTAREA */
  textarea {
    width: 100%;
    background: var(--parchment);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 12px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    color: var(--ink);
    resize: vertical;
    min-height: 80px;
    margin-top: 6px;
    outline: none;
    line-height: 1.5;
  }

  textarea:focus {
    border-color: var(--amber);
  }

  textarea::placeholder {
    color: var(--muted);
    font-style: italic;
  }

  /* GENERATE BUTTON */
  .generate-btn {
    display: block;
    width: 100%;
    margin: 28px 0 0;
    padding: 16px;
    background: var(--deep);
    color: var(--parchment);
    border: none;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: background 0.2s;
  }

  .generate-btn:hover { background: var(--rust); }

  /* RESULTS */
  #results {
    margin-top: 28px;
  }

  .results-header {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 400;
    margin-bottom: 6px;
    color: var(--deep);
  }

  .results-timestamp {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 24px;
  }

  /* TERRAIN MAP */
  .terrain-map {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 20px;
    margin-bottom: 16px;
  }

  .terrain-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .domain-bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .domain-bar-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--muted);
    width: 80px;
    flex-shrink: 0;
    text-transform: uppercase;
  }

  .bar-track {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 1px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 1px;
    transition: width 0.8s ease;
  }

  .bar-fill.critical { background: var(--rust); }
  .bar-fill.low { background: var(--blush); }
  .bar-fill.moderate { background: var(--amber); }
  .bar-fill.good { background: var(--sage); }

  .bar-pct {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    width: 32px;
    text-align: right;
  }

  /* INSIGHT CARDS */
  .insight-card {
    border-left: 3px solid var(--amber);
    padding: 16px 16px 16px 18px;
    background: var(--card);
    margin-bottom: 12px;
  }

  .insight-card.alert { border-left-color: var(--rust); }
  .insight-card.note { border-left-color: var(--sage); }

  .insight-tag {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .insight-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    color: var(--ink);
    line-height: 1.5;
  }

  /* PROTOCOL TABLE */
  .protocol-section {
    margin-bottom: 20px;
  }

  .protocol-heading {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .protocol-item {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(200,184,154,0.2);
    align-items: flex-start;
  }

  .p-priority {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 5px;
  }

  .p-priority.high { background: var(--rust); }
  .p-priority.med { background: var(--amber); }
  .p-priority.low { background: var(--sage); }

  .p-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    color: var(--ink);
    line-height: 1.4;
    flex: 1;
  }

  .p-category {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* FLOWCHART */
  .flowchart {
    margin-top: 10px;
  }

  .flow-node {
    padding: 14px 16px;
    border: 1px solid var(--border);
    background: var(--card);
    margin-bottom: 0;
    position: relative;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    line-height: 1.4;
    color: var(--ink);
  }

  .flow-node.root {
    background: var(--deep);
    color: var(--parchment);
    border-color: var(--deep);
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-size: 16px;
  }

  .flow-node.domain-node {
    border-left: 3px solid var(--amber);
    margin-left: 20px;
  }

  .flow-node.action-node {
    border-left: 3px solid var(--sage);
    margin-left: 40px;
    background: var(--parchment);
    font-size: 14px;
  }

  .flow-node.urgent-node {
    border-left: 3px solid var(--rust);
    margin-left: 40px;
    background: rgba(139,74,42,0.04);
    font-size: 14px;
  }

  .flow-arrow {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 3px 0;
    margin-left: 10px;
  }

  .flow-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 4px;
  }

  .loading {
    text-align: center;
    padding: 40px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--muted);
    font-size: 18px;
  }

  .loading::after {
    content: '';
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--amber);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-left: 10px;
    vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 24px 0;
  }

  .save-bar {
    display: flex;
    gap: 10px;
    margin: 24px 0 8px;
  }

  .save-btn {
    flex: 1;
    padding: 13px;
    background: none;
    border: 1px solid var(--border);
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    transition: all 0.2s;
  }

  .save-btn:hover { background: var(--ink); color: var(--parchment); border-color: var(--ink); }
  .save-btn.primary { background: var(--deep); color: var(--parchment); border-color: var(--deep); }
  .save-btn.primary:hover { background: var(--rust); border-color: var(--rust); }

  .selah-footer {
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--warm-mid);
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .nav-btns {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .nav-btn {
    flex: 1;
    padding: 12px;
    background: none;
    border: 1px solid var(--border);
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    transition: all 0.2s;
  }

  .nav-btn:hover, .nav-btn.primary {
    background: var(--deep);
    color: var(--parchment);
    border-color: var(--deep);
  }

  .progress-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 16px 0 0;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.2s;
  }

  .dot.done { background: var(--sage); }
  .dot.active { background: var(--amber); }

/* ── RECOGNITION STRIP ── */
.section-recognition {
  background: var(--rust);
  padding: 28px 24px;
  overflow: hidden;
}

.recognition-track {
  display: flex;
  gap: 48px;
  align-items: center;
  animation: ticker 30s linear infinite;
  white-space: nowrap;
}

@keyframes ticker {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

.recognition-item {
  font-family: 'Playfair Display', serif;
  font-size: 15px;
  font-style: italic;
  color: var(--parchment);
  opacity: 0.9;
  flex-shrink: 0;
}

.recognition-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: rgba(246,241,232,0.4);
  flex-shrink: 0;
}

/* ── THAT'S ME ── */
.section-thatsme {
  background: var(--parchment);
  color: var(--ink);
  padding: 100px 24px;
}

.thatsme-intro {
  font-family: 'Cormorant Garamond', serif;
  font-size: 19px;
  font-style: italic;
  color: var(--muted);
  max-width: 560px;
  line-height: 1.6;
  margin-bottom: 48px;
}

.thatsme-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

@media (max-width: 700px) { .thatsme-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 420px) { .thatsme-grid { grid-template-columns: 1fr; } }

.thatsme-card {
  border: 1px solid var(--border);
  padding: 22px 18px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--cream);
  position: relative;
  overflow: hidden;
}

.thatsme-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--amber);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s ease;
}

.thatsme-card:hover::before,
.thatsme-card.active::before { transform: scaleX(1); }

.thatsme-card:hover,
.thatsme-card.active {
  border-color: var(--amber);
  background: white;
}

.thatsme-emoji {
  font-size: 22px;
  margin-bottom: 10px;
  display: block;
}

.thatsme-title {
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  font-style: italic;
  color: var(--deep);
  margin-bottom: 6px;
  line-height: 1.3;
}

.thatsme-tag {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--amber);
}

/* expanded state */
.thatsme-expand {
  display: none;
  margin-top: 0;
  background: var(--deep);
  color: var(--parchment);
  padding: 40px 32px;
  border-left: 3px solid var(--blush);
  animation: expandIn 0.3s ease;
}

@keyframes expandIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.thatsme-expand.open { display: block; }

.expand-headline {
  font-family: 'Playfair Display', serif;
  font-size: clamp(20px, 3.5vw, 30px);
  font-style: italic;
  font-weight: 300;
  color: var(--parchment);
  margin-bottom: 16px;
  line-height: 1.3;
}

.expand-.about-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  color: var(--warm);
  line-height: 1.7;
  max-width: 640px;
  margin-bottom: 20px;
}

.expand-body + .expand-.expand-body + .expand-body { margin-top: -4px; }

.expand-truth {
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  font-style: italic;
  color: var(--blush);
  border-left: 2px solid var(--blush);
  padding-left: 16px;
  margin: 20px 0;
  line-height: 1.5;
}

.expand-cta {
  display: inline-block;
  margin-top: 24px;
  padding: 12px 28px;
  background: var(--amber);
  color: var(--deep);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  border: none;
  transition: background 0.2s;
  text-decoration: none;
}

.expand-cta:hover { background: var(--amber-light); }

/* ── BLOG ── */
.section-blog {
  background: var(--mid);
  padding: 100px 24px;
}

.blog-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
  margin-top: 52px;
}

@media (max-width: 680px) { .blog-grid { grid-template-columns: 1fr; } }

.blog-featured {
  grid-column: 1 / -1;
  background: var(--deep);
  border: 1px solid rgba(201,185,154,0.1);

  grid-template-columns: 1fr 1fr;
  gap: 40px;
  align-items: center;

.blog-featured:hover { border-color: rgba(176,125,53,0.4); }

.blog-card {

  transition: all 0.2s;
  position: relative;
}

.blog-card:hover { background: rgba(176,125,53,0.07); border-color: rgba(176,125,53,0.25); }

.blog-category {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--amber);
  margin-bottom: 14px;
}

.blog-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(18px, 3vw, 26px);
  font-weight: 400;
  line-height: 1.25;
  color: var(--parchment);
  margin-bottom: 14px;
}

.blog-title em { font-style: italic; color: var(--blush); }

.blog-excerpt {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  color: var(--warm);
  line-height: 1.6;
  margin-bottom: 20px;
}

.blog-meta {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
}

.blog-read-more {
  font-family: 'DM Mono', monospace;

  align-items: center;

}

.blog-read-more::after { content: '→'; }

/* blog modal */
.blog-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(22,18,13,0.92);
  z-index: 99998;
  overflow-y: auto;
  padding: 40px 24px;
}

.blog-modal-overlay.open { display: block; }

.blog-modal {

<style>
.bkv{max-width:640px;margin:0 auto;text-align:center;}

.bkv-textpage p{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(20px,3.4vw,27px);line-height:1.55;color:#f6f1e8;max-width:420px;}
.bkv-caption{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;line-height:1.65;color:var(--mid);min-height:64px;margin:22px auto 6px;max-width:520px;transition:opacity .4s ease;}
.bkv-controls{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:10px;}
.bkv-btn{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;background:none;border:1px solid var(--border);color:var(--mid);padding:12px 22px;cursor:pointer;transition:all .3s;}
.bkv-btn:hover{border-color:var(--amber);color:var(--amber);}
.bkv-btn:disabled{opacity:.35;cursor:default;}
.bkv-dots{display:flex;gap:7px;}
.bkv-dot{width:7px;height:7px;border-radius:50%;background:var(--border);transition:background .3s;}
.bkv-dot.on{background:var(--amber);}
.bkv-count{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:3px;color:var(--muted);margin-top:14px;text-transform:uppercase;}

.book-hero{padding:120px 24px 10px;text-align:center;}
.book-hero h1{font-family:'Playfair Display',serif;font-weight:300;font-style:italic;font-size:clamp(38px,7vw,64px);color:var(--deep);line-height:1.1;}
.book-hero .sub{font-family:'Cormorant Garamond',serif;font-size:19px;font-style:italic;color:var(--muted);margin-top:14px;}

</style></head>

</div>

<script>
(function(){
  var pages = [
    {img:'naya-whole.webp', cap:'Naya had a favourite bowl. Her grandmother made it with her own two hands, and Naya carried it everywhere.'},
    {img:'naya-broken.webp', cap:'One morning, the bowl slipped. Crack. Naya was sure it was finished. \u201CBroken things get thrown away,\u201D she whispered.'},
    {img:'mending-gold.webp', cap:'But Grandmother gathered every piece. \u201CWatch,\u201D she said. And with gold and patience, she began to mend what Naya thought was lost.'},
    {text:'\u201CGrandmother,\u201D Naya asked, \u201Cwhat about when I break? Is there gold for me too?\u201D', cap:''},
    {img:'naya-shine.webp', cap:'\u201COh, my love,\u201D said Grandmother. \u201CEspecially then.\u201D And the bowl, and Naya, shone in a way they never had before.'},
    {text:'Every crack tells a story. Every repair shines with strength.', cap:'The Cracks That Shine \u2014 a preview. The full book is coming soon.'}
  ];
  var i = 0, img = document.getElementById('bkvImg'), cap = document.getElementById('bkvCap'),
      txt = document.getElementById('bkvText'), txtP = document.getElementById('bkvTextP'),
      prev = document.getElementById('bkvPrev'), next = document.getElementById('bkvNext'),
      dots = document.getElementById('bkvDots'), count = document.getElementById('bkvCount');
  if (!img) return;
  pages.forEach(function(){ var d = document.createElement('div'); d.className = 'bkv-dot'; dots.appendChild(d); });
  function render(){
    var p = pages[i];
    cap.style.opacity = 0;
    setTimeout(function(){ cap.textContent = p.cap || ''; cap.style.opacity = 1; }, 200);
    if (p.text) { img.classList.add('fading'); txtP.textContent = p.text; txt.style.display = 'flex'; }
    else { txt.style.display = 'none'; img.classList.add('fading');
      setTimeout(function(){ img.src = p.img; img.onload = function(){ img.classList.remove('fading'); }; setTimeout(function(){ img.classList.remove('fading'); }, 350); }, 200); }
    prev.disabled = (i === 0); next.disabled = (i === pages.length - 1);
    count.textContent = 'Page ' + (i + 1) + ' of ' + pages.length;
    Array.prototype.forEach.call(dots.children, function(d, j){ d.className = 'bkv-dot' + (j === i ? ' on' : ''); });
  }
  window.bkvGo = function(dir){ var n = i + dir; if (n < 0 || n >= pages.length) return; i = n; render(); };
  document.addEventListener('keydown', function(e){ if (e.key === 'ArrowRight') bkvGo(1); if (e.key === 'ArrowLeft') bkvGo(-1); });
  var sx = null, frame = document.querySelector('.bkv-frame');
  frame.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; }, {passive:true});
  frame.addEventListener('touchend', function(e){ if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 42) bkvGo(dx < 0 ? 1 : -1); sx = null; }, {passive:true});
  cap.textContent = pages[0].cap; render();
})();
</script>
